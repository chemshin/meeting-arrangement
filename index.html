<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비즈솔루션본부 월요초대석 참석 신청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171B22; --ink-soft:#3A4048;
    --paper:#F3F2EF; --card:#FFFFFF;
    --accent:#C8102E; --accent-deep:#9E0C24;
    --green:#1F7A54; --slate:#5B6472; --line:#E4E1D9; --line-soft:#EEECE6;
    --shadow:0 1px 2px rgba(23,27,34,.04), 0 8px 24px rgba(23,27,34,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .serif{font-family:'Nanum Myeongjo',serif}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--accent);color:#fff}

  header.masthead{background:var(--ink);color:#F6F4EF;padding:18px 22px 0;position:sticky;top:0;z-index:40;box-shadow:0 2px 16px rgba(0,0,0,.18)}
  .mast-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;max-width:1040px;margin:0 auto}
  .nameplate .title{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(24px,4vw,36px);letter-spacing:.05em;line-height:1}
  .nameplate .title .em{color:var(--accent)}
  .nameplate .logo{height:clamp(30px,5.4vw,42px);width:auto;display:block}
  .nameplate .kicker{font-size:11px;letter-spacing:.32em;color:#B9BEC7;text-transform:uppercase;margin-top:7px}
  .rule-double{max-width:1040px;margin:12px auto 0;border-top:2px solid #4A515C;padding-top:3px}
  .rule-double .inner{border-top:1px solid #333B46;height:0}
  nav.tabs{max-width:1040px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 0 0}
  nav.tabs button{background:transparent;border:0;color:#AEB4BE;padding:11px 18px 13px;font-size:14px;font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap}
  nav.tabs button:hover{color:#F6F4EF}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--accent)}
  nav.tabs .tab-note{font-size:11px;font-weight:600;color:#7E8590;letter-spacing:0}
  nav.tabs button:hover .tab-note{color:#AEB4BE}

  main{max-width:1040px;margin:0 auto;padding:30px 22px 80px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view,main *{animation:none!important}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  /* ---------- 신청 폼 ---------- */
  .apply-head{max-width:640px;margin:0 auto 26px;text-align:center}
  .apply-head h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(24px,4.2vw,33px);margin:0 0 10px;letter-spacing:-.01em;line-height:1.3}
  .apply-head p{font-size:14px;color:var(--slate);margin:0}
  .form-card{max-width:640px;margin:0 auto;padding:32px 34px}
  .q{margin-bottom:26px}
  .q > label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:9px;letter-spacing:.01em}
  .q > label .num{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--ink);color:#fff;border-radius:6px;font-size:11px;font-family:'Nanum Myeongjo',serif;margin-right:8px;vertical-align:1px}
  .q > label .opt{font-weight:600;color:var(--slate);font-size:11.5px;margin-left:6px}
  .q input[type=text],.q textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;color:var(--ink);background:var(--card)}
  .q textarea{resize:vertical;min-height:76px;line-height:1.6}
  .q input:focus,.q textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .week-cards{display:flex;flex-direction:column;gap:10px}
  .radio-card{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:11px;padding:14px 16px;cursor:pointer;transition:.15s;background:var(--card)}
  .radio-card:hover{border-color:var(--slate)}
  .radio-card.sel{border-color:var(--accent);background:#FEF6F7}
  .radio-card .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center}
  .radio-card.sel .tick{border-color:var(--accent);background:var(--accent)}
  .radio-card.sel .tick::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
  .radio-card .ed{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:13px;color:var(--accent);width:52px;flex-shrink:0}
  .radio-card .wtitle{font-weight:600;font-size:14.5px}
  .radio-card .wbody{min-width:0}
  .radio-card .wdesc{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.55}
  .radio-card .wdate{font-size:12.5px;color:var(--slate);margin-top:2px}
  .week-loading{display:flex;align-items:center;gap:9px;color:var(--slate);font-size:13.5px;padding:16px;border:1px dashed var(--line);border-radius:11px}
  .submit-btn{width:100%;padding:15px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15.5px;font-weight:700;transition:.15s}
  .submit-btn:hover{background:var(--accent-deep)}
  .submit-btn:disabled{opacity:.55;cursor:progress}
  .form-note{font-size:12.5px;color:var(--slate);text-align:center;margin-top:14px}

  .success{max-width:640px;margin:0 auto;padding:40px 34px;text-align:center}
  .success .mark{width:64px;height:64px;border-radius:50%;background:#E6F3EC;color:var(--green);display:grid;place-items:center;margin:0 auto 20px;font-size:32px}
  .success h2{font-family:'Nanum Myeongjo',serif;font-size:24px;margin:0 0 10px}
  .success p{color:var(--ink-soft);font-size:14.5px;margin:0 0 6px}
  .success .detail{background:var(--paper);border-radius:11px;padding:16px 18px;margin:22px 0;text-align:left;font-size:14px}
  .success .detail .r{display:flex;gap:12px;padding:5px 0}
  .success .detail .r b{color:var(--slate);font-weight:600;width:70px;flex-shrink:0;font-size:13px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;transition:.15s;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--slate)}

  /* ---------- 노션 ---------- */
  .notion-frame{width:100%;height:76vh;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
  .notion-card{max-width:600px;margin:24px auto;padding:36px 34px;text-align:center}
  .notion-card .ic{width:60px;height:60px;border-radius:16px;background:var(--paper);display:grid;place-items:center;margin:0 auto 18px;font-size:28px}
  .notion-card h2{font-family:'Nanum Myeongjo',serif;font-size:22px;margin:0 0 12px}
  .notion-card p{color:var(--ink-soft);font-size:14px;line-height:1.7;margin:0 0 8px}
  .notion-card code{background:var(--paper);padding:2px 7px;border-radius:5px;font-size:13px}
  .notion-card .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);margin-top:14px;padding:13px 26px;font-size:14.5px}
  .notion-card .btn.primary:hover{background:#000}

  /* ---------- 통계 ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  .section-title{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
  .btn.sm.ghost{background:transparent;color:var(--slate)}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
  .stat{padding:18px 20px}
  .stat .label{font-size:12px;color:var(--slate);font-weight:600}
  .stat .val{font-family:'Nanum Myeongjo',serif;font-size:29px;font-weight:800;margin-top:6px;line-height:1}
  .stat .val small{font-size:14px;color:var(--slate);font-weight:600;margin-left:3px}
  .stat .foot{font-size:11.5px;color:var(--slate);margin-top:7px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--slate);text-transform:uppercase;font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line)}
  tbody td{padding:11px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  .team-head{cursor:pointer;user-select:none}
  .team-head:hover td{background:#F4F2ED!important}
  .team-head td{background:#FAF9F6;font-weight:700;font-size:13px;color:var(--ink-soft)}
  .caret{display:inline-block;width:16px;color:var(--slate);font-size:11px}
  .team-tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--slate);background:var(--line-soft);padding:3px 9px;border-radius:20px}
  .count-cell{display:flex;align-items:center;gap:10px;min-width:120px;justify-content:flex-end}
  .count-cell .mini{width:90px;height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden}
  .count-cell .mini i{display:block;height:100%;background:var(--green);border-radius:4px}
  .count-cell b{font-variant-numeric:tabular-nums;font-size:13.5px;width:34px;text-align:right}
  .rounds{display:flex;flex-wrap:wrap;gap:4px;max-width:380px}
  .rchip{font-size:11px;font-weight:700;color:var(--slate);background:var(--line-soft);border-radius:5px;padding:2px 7px;font-variant-numeric:tabular-nums}
  .rank{width:30px;text-align:center;color:var(--slate);font-variant-numeric:tabular-nums;font-weight:700}
  .banner{display:flex;gap:11px;background:#FBECEE;border:1px solid #F0C4CC;color:#8A1226;border-radius:11px;padding:12px 16px;font-size:13px;margin-bottom:20px;line-height:1.6}
  .empty{text-align:center;color:var(--slate);padding:40px 20px;font-size:14px}
  .loading{text-align:center;color:var(--slate);padding:70px 20px;font-size:14px}
  .spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-4px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:.3s;box-shadow:0 8px 30px rgba(0,0,0,.25);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--accent)}
  @media (max-width:720px){ .stat-row{grid-template-columns:1fr} .form-card{padding:24px 20px} }
</style>
</head>

  if(w.dateISO){
    const [y,m,d]=w.dateISO.split('-').map(Number);
    const dow=w.dow||['일','월','화','수','목','금','토'][new Date(w.dateISO+'T00:00').getDay()];
    return `${m}월 ${d}일 (${dow})`;
  }
  const s=(w.date||'').trim();
  const mm=s.match(/(\d{1,2})\D+(\d{1,2})/);
  return mm ? `${+mm[1]}월 ${+mm[2]}일${w.dow?` (${w.dow})`:''}` : s;
}
function isPast(w){ return w.dateISO ? new Date(w.dateISO+'T00:00') < new Date(new Date().toDateString()) : false; }
function attList(w){
  if(w.actualAttendees && w.actualAttendees.length) return w.actualAttendees;
  if(w.attendees && w.attendees.length) return w.attendees;
  return Object.keys(w.apply||{}).filter(n=>w.apply[n]==='참석');
}
function isoNow(off){ const d=new Date(); if(off)d.setDate(d.getDate()+off); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function applicableWeeks(){
  const t=isoNow(0), max=isoNow(APPLY_WINDOW_DAYS);
  return titledWeeks().filter(w=>w.dateISO && w.dateISO>=t && w.dateISO<=max).sort((a,b)=>a.dateISO<b.dateISO?-1:1);
}
const norm=s=>String(s||'').replace(/\s/g,'').toLowerCase();
function teamRank(t){ const nt=norm(t); const i=TEAM_ORDER.findIndex(x=>{const nx=norm(x); return nt===nx||nt.indexOf(nx)>=0||nx.indexOf(nt)>=0;}); return i<0?900:i; }

/* ---------------- 데이터 로드 (백그라운드) ---------------- */
async function load(){
  try{
    const res=await fetch(API,{method:'GET'});
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'불러오기 실패');
    state.weeks=data.weeks||[];
    state.roster=cleanRoster(data.roster);
    state.currentRound=data.currentRound||0;
    state.loading=false;
    const aw=applicableWeeks(); if(aw.length && !state.form.round) state.form.round=aw[0].round;
    renderWeekCards();     // 폼의 특집 영역만 채움 (입력값 보존)
    renderStats();
  }catch(err){
    state.loading=false; state.error=err.message||String(err);
    renderWeekCards(); renderStats();
  }
}

function cleanRoster(arr){ return (arr||[]).filter(m=>m.name && m.team && !['타운보드','비즈솔루션본부'].includes(m.name)); }

async function submitForm(){
  const {name,team,round,suggestion}=state.form;
  if(!name.trim()){ toast('이름을 입력하세요',true); $('#fName')&&$('#fName').focus(); return; }
  if(!round){ toast('참여할 특집을 선택하세요',true); return; }
  const btn=$('#submitBtn'); if(btn){ btn.disabled=true; btn.textContent='신청 중…'; }
  try{
    // POST가 iOS Safari에서 막히는 문제가 있어 GET 쿼리로 신청을 전송합니다.
    const q='?action=rsvp'
      +'&round='+encodeURIComponent(round)
      +'&name='+encodeURIComponent(name.trim())
      +'&team='+encodeURIComponent(team.trim())
      +'&status='+encodeURIComponent('참석')
      +'&suggestion='+encodeURIComponent((suggestion||'').trim());
    const res=await fetch(API+q);
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'저장 실패');
    if(data.data){ state.weeks=data.data.weeks; state.roster=cleanRoster(data.data.roster); state.currentRound=data.data.currentRound; }
    renderSuccess(name.trim(), team.trim(), weekByRound(round), (suggestion||'').trim());
    renderStats();
  }catch(err){
    toast('신청 실패: '+err.message, true);
    if(btn){ btn.disabled=false; btn.textContent='참석 신청하기'; }
  }
}

/* ---------- 참석 신청 폼 (즉시 노출) ---------- */
function renderForm(){
  $('#view-apply').innerHTML=`
    <div class="apply-head">
      <h1>비즈솔루션본부 월요초대석<br>참석 신청</h1>
      <p>아래 내용을 입력하면 신청이 접수됩니다.</p>
    </div>
    <div class="card form-card">
      <div class="q">
        <label><span class="num serif">1</span>이름</label>
        <input type="text" id="fName" placeholder="이름을 입력하세요" value="${esc(state.form.name)}"
          oninput="state.form.name=this.value" autocomplete="off">
      </div>
      <div class="q">
        <label><span class="num serif">2</span>소속팀</label>
        <input type="text" id="fTeam" placeholder="예) 마케팅솔루션1팀" value="${esc(state.form.team)}"
          oninput="state.form.team=this.value" autocomplete="off">
      </div>
      <div class="q">
        <label><span class="num serif">3</span>참여 원하는 특집</label>
        <div class="week-cards" id="weekCards"></div>
      </div>
      <div class="q">
        <label><span class="num serif">4</span>특집 제안<span class="opt">선택</span></label>
        <textarea id="fSug" placeholder="하면 좋을거 같은 특집 있으면 말씀주세요~"
          oninput="state.form.suggestion=this.value">${esc(state.form.suggestion)}</textarea>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="submitForm()">참석 신청하기</button>
      <div class="form-note">신청 내역은 스프레드시트에 자동으로 누적됩니다.</div>
    </div>`;
  renderWeekCards();
}
function renderWeekCards(){
  const box=$('#weekCards'); if(!box) return;
  if(state.loading){ box.innerHTML=`<div class="week-loading"><span class="spin"></span>특집 목록을 불러오는 중…</div>`; return; }
  if(state.error){ box.innerHTML=`<div class="week-loading" style="border-color:#F0C4CC;color:#8A1226">특집 목록을 불러오지 못했습니다. 새로고침해 주세요.</div>`; return; }
  const aw=applicableWeeks();
  if(!aw.length){ box.innerHTML=`<div class="empty" style="border:1px dashed var(--line);border-radius:11px">${Math.round(APPLY_WINDOW_DAYS/7)}주 내 예정된 특집이 없습니다.</div>`; return; }
  if(!state.form.round) state.form.round=aw[0].round;
  box.innerHTML=aw.map(w=>`
    <div class="radio-card ${state.form.round===w.round?'sel':''}" data-round="${w.round}">
      <div class="tick"></div>
      <div class="ed serif">제${w.round}회</div>
      <div class="wbody">
        <div class="wtitle">${esc(w.title)}</div>
        <div class="wdate">${esc(fmtDate(w))}${w.place?' · '+esc(w.place):''}</div>
        ${w.desc?`<div class="wdesc">${esc(w.desc)}</div>`:''}
      </div>
    </div>`).join('');
  box.onclick=e=>{
    const c=e.target.closest('.radio-card[data-round]'); if(!c)return;
    state.form.round=Number(c.dataset.round);
    $$('#weekCards .radio-card').forEach(x=>x.classList.toggle('sel', Number(x.dataset.round)===state.form.round));
  };
}
function renderSuccess(name, team, w, suggestion){
  $('#view-apply').innerHTML=`
    <div class="card success">
      <div class="mark">✓</div>
      <h2>신청이 접수되었습니다</h2>
      <p>${esc(name)} 님, 참석 신청이 정상적으로 저장되었습니다.</p>
      <div class="detail">
        <div class="r"><b>이름</b><span>${esc(name)}</span></div>
        ${team?`<div class="r"><b>소속팀</b><span>${esc(team)}</span></div>`:''}
        ${w?`<div class="r"><b>특집</b><span>제${w.round}회 · ${esc(w.title)}</span></div>
        <div class="r"><b>일자</b><span>${esc(fmtDate(w))}${w.place?' · '+esc(w.place):''}</span></div>
        ${w.desc?`<div class="r"><b>설명</b><span>${esc(w.desc)}</span></div>`:''}`:''}
        ${suggestion?`<div class="r"><b>특집 제안</b><span>${esc(suggestion)}</span></div>`:''}
      </div>
      <button class="btn" onclick="resetForm()">다른 신청 하기</button>
    </div>`;
}
function resetForm(){
  const keepRound=state.form.round;
  state.form={name:'',team:'',round:keepRound,suggestion:''};
  renderForm();
}

/* ---------- 지난 특집 보기 (노션) ---------- */
function renderNotion(){
  const el=$('#view-past');
  if(!NOTION_URL || !/^https?:\/\//.test(NOTION_URL)){
    el.innerHTML=`<div class="card notion-card"><div class="ic">📄</div><h2>노션 페이지 연결 필요</h2>
      <p><code>NOTION_URL</code> 값에 노션 주소를 넣어주세요.</p></div>`;
    return;
  }
  // 노션 게시(.notion.site) 페이지는 보안 정책상 iframe 삽입이 차단되어 새 탭으로 엽니다.
  el.innerHTML=`
    <div class="card notion-card">
      <div class="ic">📄</div>
      <h2>지난 특집 아카이브</h2>
      <p>지난 특집 기록은 노션 페이지에 정리되어 있습니다.<br>이 탭에 들어오면 노션 페이지가 새 탭으로 열립니다.</p>
      <a class="btn primary" id="notionOpen" href="${esc(NOTION_URL)}" target="_blank" rel="noopener">지난 특집 페이지 열기 ↗</a>
      <p style="color:var(--slate);font-size:12px;margin-top:16px">노션 정책상 이 페이지는 사이트 안에 직접 삽입(iframe)할 수 없어<br>새 탭으로 열립니다.</p>
    </div>`;
}

/* ---------- 통계 ---------- */
function renderStats(){
  const el=$('#view-stats');
  if(state.loading){ el.innerHTML=`<div class="loading"><span class="spin"></span>불러오는 중…</div>`; return; }
  if(!state.roster.length){ el.innerHTML=`<div class="empty">출석부에서 명단을 찾지 못했습니다.</div>`; return; }

  // 실제 진행된 회차(제목 있고, 오늘까지, 참석자 기록 있음)에서 참석 집계
  const today=isoNow(0);
  const held=titledWeeks().filter(w=>w.dateISO && w.dateISO<=today && attList(w).length).sort((a,b)=>a.round-b.round);

  const roundsOf={}; state.roster.forEach(m=>roundsOf[m.name]=[]);
  held.forEach(w=>attList(w).forEach(n=>{ if(roundsOf[n]) roundsOf[n].push(w.round); }));
  const cnt=name=>(roundsOf[name]||[]).length;
  const maxCount=Math.max(1,...state.roster.map(m=>cnt(m.name)));

  const countCell=c=>`<div class="count-cell"><div class="mini"><i style="width:${Math.round((c/maxCount)*100)}%"></i></div><b>${c}회</b></div>`;
  const roundsCell=name=>{
    const rs=roundsOf[name]||[];
    return rs.length?`<div class="rounds">${rs.map(r=>`<span class="rchip">${r}회</span>`).join('')}</div>`
                    :'<span style="color:var(--slate);font-size:12.5px">–</span>';
  };

  let body;
  if(state.memberSort==='count'){
    const sorted=[...state.roster].sort((a,b)=>cnt(b.name)-cnt(a.name) || (a.name<b.name?-1:1));
    const rows=sorted.map((m,i)=>`<tr>
      <td class="rank">${i+1}</td>
      <td><b>${esc(m.name)}</b>${m.team?` <span class="team-tag">${esc(m.team)}</span>`:''}</td>
      <td>${roundsCell(m.name)}</td>
      <td style="text-align:right">${countCell(cnt(m.name))}</td></tr>`).join('');
    body=`<table><thead><tr><th class="rank">#</th><th>이름</th><th>참석 회차</th><th style="text-align:right">참석 횟수</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    const teams=[...new Set(state.roster.map(m=>m.team||'기타'))]
      .sort((a,b)=>{ const ra=teamRank(a), rb=teamRank(b); return ra!==rb?ra-rb:(a<b?-1:1); });
    const rows=teams.map(t=>{
      const ms=state.roster.filter(m=>(m.team||'기타')===t);
      const open=!state.collapsed[t];
      const head=`<tr class="team-head" data-team="${esc(t)}">
        <td colspan="3"><span class="caret">${open?'▾':'▸'}</span>${esc(t)} · ${ms.length}명</td></tr>`;
      const rws=open?ms.map(m=>`<tr>
        <td><b>${esc(m.name)}</b></td>
        <td>${roundsCell(m.name)}</td>
        <td style="text-align:right">${countCell(cnt(m.name))}</td></tr>`).join(''):'';
      return head+rws;
    }).join('');
    body=`<table><thead><tr><th>이름</th><th>참석 회차</th><th style="text-align:right">참석 횟수</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  const top=[...state.roster].sort((a,b)=>cnt(b.name)-cnt(a.name))[0];
  const avg=held.length?Math.round(held.reduce((s,w)=>s+attList(w).length,0)/held.length):0;

  el.innerHTML=`
    <div class="stat-row">
      <div class="card stat"><div class="label">진행 회차</div><div class="val">${held.length}<small>회</small></div><div class="foot">본부원 ${state.roster.length}명</div></div>
      <div class="card stat"><div class="label">평균 참석 인원</div><div class="val">${avg}<small>명</small></div><div class="foot">진행된 회차 기준</div></div>
      <div class="card stat"><div class="label">최다 참석</div><div class="val">${top?cnt(top.name):0}<small>회</small></div><div class="foot">${top?esc(top.name):'-'}</div></div>
    </div>
    <div class="toolbar">
      <div class="section-title">전체 본부원 · ${state.roster.length}명</div>
      <div class="spacer"></div>
      <button class="btn sm ${state.memberSort==='team'?'':'ghost'}" data-sort="team">팀별</button>
      <button class="btn sm ${state.memberSort==='count'?'':'ghost'}" data-sort="count">참석순</button>
    </div>
    <div class="card">${body}</div>
    <div class="form-note" style="text-align:left;margin-top:12px">참석 회차·횟수는 스케줄의 회차별 <b>참석자</b> 명단 기준으로 집계됩니다.</div>`;
}
function toggleTeam(t){ state.collapsed[t]=!state.collapsed[t]; renderStats(); }
function setMemberSort(m){ state.memberSort=m; renderStats(); }

/* ---------- 탭 / 이벤트 ---------- */
function switchTab(v){
  $$('#tabs button').forEach(x=>x.classList.toggle('active', x.dataset.view===v));
  $$('.view').forEach(s=>s.classList.remove('active'));
  $('#view-'+v).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]'); if(!b) return;
  switchTab(b.dataset.view);
  // 지난 특집 탭 진입 시 노션을 새 탭으로 자동 오픈(세션당 1회, 클릭 제스처라 팝업 차단 안 됨)
  if(b.dataset.view==='past' && NOTION_URL && /^https?:\/\//.test(NOTION_URL) && !state.notionOpened){
    state.notionOpened=true;
    window.open(NOTION_URL,'_blank','noopener');
  }
});
$('#view-stats').addEventListener('click',e=>{
  const th=e.target.closest('.team-head'); if(th){ toggleTeam(th.dataset.team); return; }
  const sb=e.target.closest('[data-sort]'); if(sb){ setMemberSort(sb.dataset.sort); }
});

/* ---------- 부팅: 폼 먼저, 로딩은 뒤에서 ---------- */
renderForm();
renderNotion();
load();
</script>
